<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles | Srijana’s thoughts</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <meta name="description" content="All articles by Srijana — thoughts, experiences, observations and stories.">
</head>

<body>
    <div class="container">
        <header class="site-header">
            <a href="index.html" class="site-title"> Srijana’s thoughts </a>
            <nav class="main-nav">
                <a href="index.html"> Home </a>
                <a href="about.html"> About</a>
                <a href="book-reviews.html"> Book Reviews</a>
                <a href="articles-list.html" class="active"> Articles </a>
                <a href="#subscribe-section"> Subscribe</a>
            </nav>
            <button id="theme-toggle" aria-label="Toggle dark mode"> 🌙 </button>
        </header>

        <section class="articles-intro">
            <div class="articles-intro-text">
                <h1> Articles </h1>
                <p> Thoughts, experiences and stories from my journey. </p>
            </div>

            <div class="articles-list-search">
                <input type="text" id="articleSearchInput" placeholder="Search articles..." autocomplete="off">
                <button type="button" id="articleSearchButton"> Search </button>
            </div>
        </section>

        <div class="articles-list-top">
            <p id="article-count"> Showing all articles </p>
        </div>

        <main class="articles-list-grid" id="articles-list-grid"> <!-- Articles inserted by JavaScript --> </main>

        <div class="articles-pagination" id="articles-pagination"> </div>

        <section id="subscribe-section" class="homepage-subscribe">
            <iframe src="https://subscribe-forms.beehiiv.com/e8cd9df8-6170-495d-a150-d30e37e48b24" class="beehiiv-embed"
                data-test-id="beehiiv-embed" frameborder="0" scrolling="no"
                sandbox="allow-scripts allow-forms allow-same-origin allow-popups">
            </iframe>
        </section>
    </div>

    <footer class="site-footer">
        <p class="footer-social">
            <a href="https://twitter.com/@GautamShiru" target="_blank"> <i class="fab fa-twitter"></i> </a>
            <a href="https://linkedin.com/in/srijana-raghunath-739bb1221" target="_blank"> <i
                    class="fab fa-linkedin"></i></a>
            <a href="https://facebook.com/srijana.raghunath" target="_blank"> <i class="fab fa-facebook"></i> </a>
            <a href="https://wa.me/918408035577" target="_blank"> <i class="fab fa-whatsapp"></i> </a>
            <a href="mailto:srijana.thinks@gmail.com"> <i class="fas fa-envelope"></i> </a>
        </p>

        <p class="footer-copy"> © 2026 Srijana Gautam </p>
    </footer>

    <script src="js/articles-data.js"></script>
    <script src="js/theme.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const grid = document.getElementById("articles-list-grid");
            const pagination = document.getElementById("articles-pagination");
            const count = document.getElementById("article-count");
            const searchInput = document.getElementById("articleSearchInput");
            const searchButton = document.getElementById("articleSearchButton");

            if (!grid || !window.articlesData) return;

            const articlesPerPage = 12;
            let currentPage = 1;
            let filteredArticles = [...window.articlesData];

            function formatDate(date) {
                return new Date(date).toLocaleDateString(
                    "en-US",
                    {
                        year: "numeric",
                        month: "short",
                        day: "numeric"
                    }
                );
            }

            function displayArticles() {
                grid.innerHTML = "";
                const start = (currentPage - 1) * articlesPerPage;
                const end = start + articlesPerPage;
                const pageArticles = filteredArticles.slice(start, end);

                pageArticles.forEach(article => {
                    const card = document.createElement("article");
                    card.className = "articles-list-card";
                    card.innerHTML = `
            <a href="htmls/${article.slug}.html"            class="articles-list-image-link"             >
              <img                 src="${article.thumbnail}"                 alt="${article.title}"                 class="articles-list-thumbnail">

            </a>

            <div class="articles-list-card-content">
              <p class="articles-list-date">   ${formatDate(article.date)}     </p>
              <h2> <a href="htmls/${article.slug}.html">  ${article.title} </a></h2>
              <p class="articles-list-excerpt">
                ${article.excerpt || ""}
              </p>

              <a href="htmls/${article.slug}.html" class="articles-list-read" > Read more → </a>
            </div>
          `;

                    grid.appendChild(card);
                });

                if (filteredArticles.length === 0) {
                    count.textContent = "No articles found.";
                } else {
                    const first = start + 1;
                    const last = Math.min(end, filteredArticles.length);
                    count.textContent = `Showing ${first}–${last} of ${filteredArticles.length} articles`;
                }
                createPagination();
            }

            function createPagination() {
                pagination.innerHTML = "";
                const totalPages =
                    Math.ceil(
                        filteredArticles.length /
                        articlesPerPage
                    );

                if (totalPages <= 1) return;
                if (currentPage > 1) {
                    const previous =
                        document.createElement("button");
                    previous.textContent = "‹";
                    previous.className =
                        "pagination-arrow";
                    previous.addEventListener(
                        "click",
                        () => {
                            currentPage--;
                            displayArticles();
                            window.scrollTo({
                                top: 0,
                                behavior: "smooth"
                            });
                        }
                    );
                    pagination.appendChild(previous);
                }

                for (
                    let page = 1;
                    page <= totalPages;
                    page++
                ) {

                    const button =
                        document.createElement("button");
                    button.textContent = page;
                    button.className =
                        "pagination-number";
                    if (page === currentPage) {
                        button.classList.add(
                            "active"
                        );
                    }
                    button.addEventListener(
                        "click",
                        () => {
                            currentPage = page;
                            displayArticles();
                            window.scrollTo({
                                top: 0,
                                behavior: "smooth"
                            });
                        }
                    );

                    pagination.appendChild(button);
                }

                if (currentPage < totalPages) {
                    const next =
                        document.createElement("button");
                    next.textContent = "›";
                    next.className =
                        "pagination-arrow";
                    next.addEventListener(
                        "click",
                        () => {
                            currentPage++;
                            displayArticles();
                            window.scrollTo({
                                top: 0,
                                behavior: "smooth"
                            });
                        }
                    );
                    pagination.appendChild(next);
                }
            }

            function performSearch() {
                const query =
                    searchInput.value
                        .trim()
                        .toLowerCase();
                if (!query) {
                    filteredArticles =
                        [...window.articlesData];
                } else {
                    filteredArticles =
                        window.articlesData.filter(
                            article =>
                                article.title
                                    .toLowerCase()
                                    .includes(query)
                        );
                }

                currentPage = 1;
                displayArticles();
            }

            searchButton.addEventListener(
                "click",
                performSearch
            );

            searchInput.addEventListener(
                "keydown",
                event => {
                    if (event.key === "Enter") {
                        performSearch();
                    }
                }
            );

            displayArticles();
        });
    </script>
</body>

</html>
